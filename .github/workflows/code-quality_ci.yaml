name: P-Code Taint Engine CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # The engine has TWO implementations of one specification -- the
    # whole-instruction differential and the compiled taint program -- and they
    # disagree in both directions on about twelve percent of AMD64 cases, so a
    # release is only correct if BOTH are.  One axis, one env var, and the suite
    # exercises one implementation from top to bottom per job.
    strategy:
      fail-fast: false
      matrix:
        taint_path: ['0', '1']

    name: build (taint path ${{ matrix.taint_path }})

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the project
        id: install
        run: uv sync --locked --all-extras --dev

      - name: Lint with Ruff
        if: always() && steps.install.outcome == 'success'
        run: uv run ruff check .

      - name: Type Check with Mypy
        if: always() && steps.install.outcome == 'success'
        run: uv run mypy .

      # The FAST tier: everything except the full-bank sweeps, with the
      # randomised fuzzers on a reduced fixed-seed budget.  Their seeds are a
      # prefix of the full set, so a failure here reproduces at the same seed
      # under the release run below.
      - name: Test with pytest (fast tier)
        id: test
        if: always() && steps.install.outcome == 'success'
        env:
          MICROTAINT_TAINT_IR: ${{ matrix.taint_path }}
        # Run sequentially: -p no:xdist forces single-process even if pytest-xdist
        # is ever installed, since the native C extensions can segfault a worker
        # under parallel execution (the flaky test_multi_scenario_backends_agree /
        # RISC-V worker crashes seen only under `-n auto`).
        run: uv run pytest --cov --cov-branch --cov-report=xml -p no:xdist

      - name: Upload coverage reports to Codecov
        if: always() && steps.test.outcome == 'success'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Performance job.  Runs on EVERY pull request, because the whole suite takes
  # well under a minute (~41 s locally, all seven ISAs and three workloads).
  #
  # Two kinds of number come out of benchmark/bench_suite.py and they are used
  # differently:
  #
  #   gates    deterministic -- counters, coverage, operation counts.  Identical
  #            on any machine for a given commit, so a regression here FAILS the
  #            job.  This is what actually guards performance work.
  #   timings  vary with whatever else the runner is doing, so they are reported
  #            as RATIOS against a baseline measured in the same run, and are
  #            advisory only.  A shared CI runner cannot hold an absolute
  #            nanosecond figure still, and pretending otherwise produces a
  #            benchmark that cries wolf until everyone ignores it.
  #
  # The previous job here timed `generate_static_rule` -- the cost of LIFTING an
  # instruction.  The decode cache amortises that to nothing and the compiled
  # taint path barely touches it, so it tracked one of the least relevant
  # numbers in the engine, in absolute microseconds, on a shared runner.
  # ---------------------------------------------------------------------------
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to post the report on PRs

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      # The key carries the COMMIT, and the restore falls back on the prefix.
      # A GitHub Actions cache entry is immutable: saving to a key that already
      # exists is a silent no-op.  With one fixed key the baseline was
      # therefore frozen at whatever the first master push recorded, and every
      # later save did nothing -- so a deliberate, explained increase (the
      # p-code loop unrolling added thousands of operations to buy soundness)
      # would have failed this job on every PR from then on, with no way to
      # accept it.  A rotating key plus `restore-keys` gives the intended
      # behaviour: compare against the most recent master, and let master
      # advance.
      - name: Restore baseline
        id: cache-bench
        uses: actions/cache/restore@v4
        with:
          path: .bench_baseline.json
          key: benchmark-baseline-${{ runner.os }}-py313-${{ github.sha }}
          restore-keys: |
            benchmark-baseline-${{ runner.os }}-py313-

      - name: Run the performance suite
        run: uv run python benchmark/bench_suite.py --json .bench_current.json

      - name: Gates (deterministic; a regression fails the job)
        run: |
          uv run python - <<'EOF'
          import json, os, sys

          cur = json.load(open('.bench_current.json'))['gates']
          try:
              base = json.load(open('.bench_baseline.json'))['gates']
          except (OSError, KeyError):
              print('No baseline yet; recording the gates below for next time.')
              for k, v in sorted(cur.items()):
                  print(f'  {k:<28} {v}')
              sys.exit(0)

          # What each gate means, and which direction is bad.  These are
          # properties of the ENGINE, not of the machine: they do not move
          # unless the engine's behaviour moved.
          worse = []
          for key, now in sorted(cur.items()):
              was = base.get(key)
              if was is None:
                  print(f'  new gate {key} = {now}')
                  continue
              if key.endswith('_lowered')  and now < was:
                  worse.append(f'{key}: {was} -> {now} (fewer forms lower; '
                               f'the compiled path lost coverage)')
              elif key.endswith('_declined') and now > was:
                  worse.append(f'{key}: {was} -> {now} (more forms fall back, '
                               f'and the fallback is ~30,000x slower per instruction)')
              elif key.endswith('_total_ops') and now > was:
                  worse.append(f'{key}: {was} -> {now} (+{100*(now-was)/max(was,1):.1f}% '
                               f'operations to answer the same instructions)')
              elif now != was:
                  print(f'  {key}: {was} -> {now}')
              else:
                  print(f'  {key}: {now} (unchanged)')

          if worse:
              print('\nPERFORMANCE GATES FAILED:', file=sys.stderr)
              for w in worse:
                  print(f'  - {w}', file=sys.stderr)
              sys.exit(1)
          print('\nAll gates held.')
          EOF

      - name: Report the timings (advisory)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          uv run python - <<'EOF'
          import json, os, subprocess

          cur = json.load(open('.bench_current.json'))
          try:
              base = json.load(open('.bench_baseline.json'))
          except OSError:
              base = None

          L = ['## Performance', '',
               '_Gates are checked separately and fail the job. The figures below are '
               'advisory: a shared runner cannot hold an absolute nanosecond still, so '
               'the column that matters is the ratio to bare emulation measured in the '
               'same run._', '']

          L += ['### End to end', '',
                '| workload | bare | + hooked | + taint | x bare |',
                '|---|---|---|---|---|']
          for name, v in sorted(cur['a_end_to_end'].items()):
              L.append(f"| `{name}` | {v['bare_ns']:.1f} ns | {v['hooked_ns']:.1f} ns "
                       f"| {v['full_ns']:.1f} ns | **{v['x_bare']:.2f}x** |")

          b = cur.get('b_throughput') or {}
          if b:
              L += ['', '### Throughput', '',
                    f"- reusing one process: **{b['exec_per_sec_reusing_process']:.1f}** exec/s",
                    f"- a fresh process each: **{b['exec_per_sec_fresh_process']:.1f}** exec/s",
                    f"- per-execution setup: {b['setup_cost_seconds']*1000:.0f} ms"]

          if cur.get('c_per_instruction'):
              L += ['', '### Per instruction (compiled path)', '',
                    '| ISA | p50 | p100 | fallback p50 |', '|---|---|---|---|']
              for isa, v in sorted(cur['c_per_instruction'].items()):
                  t = cur.get('t_fallback_tail', {}).get(isa)
                  tail = f"{t['p50']/1000:.0f} us" if t else '-'
                  L.append(f"| {isa} | {v['p50']:.2f} ns | {v['p100']:.2f} ns | {tail} |")

          if cur.get('d_primitives'):
              L += ['', '### Primitives (pure C)', '',
                    ' / '.join(f'{k} {v} ns' for k, v in sorted(cur['d_primitives'].items()))]

          if base:
              L += ['', '### Against the baseline', '']
              for name, v in sorted(cur['a_end_to_end'].items()):
                  o = base.get('a_end_to_end', {}).get(name)
                  if not o:
                      continue
                  d = 100 * (v['x_bare'] - o['x_bare']) / o['x_bare']
                  mark = '🔴' if d > 10 else ('🟢' if d < -5 else '⚪')
                  L.append(f"- {mark} `{name}`: {o['x_bare']:.2f}x -> {v['x_bare']:.2f}x "
                           f"({d:+.1f}%)")

          body = '\n'.join(L)
          print(body)
          try:
              subprocess.run(['gh', 'pr', 'comment', os.environ['PR_NUMBER'],
                              '--repo', os.environ['REPO'], '--body', body], check=False)
          except Exception as e:
              print(f'could not post: {e}')
          EOF

      - name: Save the baseline (master only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: cp .bench_current.json .bench_baseline.json

      - name: Store the baseline (master only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: .bench_baseline.json
          key: benchmark-baseline-${{ runner.os }}-py313-${{ github.sha }}
