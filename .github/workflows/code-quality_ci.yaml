name: P-Code Taint Engine CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # The engine has TWO implementations of one specification -- the
    # whole-instruction differential and the compiled taint program -- and they
    # disagree in both directions on about twelve percent of AMD64 cases, so a
    # release is only correct if BOTH are.  One axis, one env var, and the suite
    # exercises one implementation from top to bottom per job.
    strategy:
      fail-fast: false
      matrix:
        taint_path: ['0', '1']

    name: build (taint path ${{ matrix.taint_path }})

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the project
        id: install
        run: uv sync --locked --all-extras --dev

      - name: Lint with Ruff
        if: always() && steps.install.outcome == 'success'
        run: uv run ruff check .

      - name: Type Check with Mypy
        if: always() && steps.install.outcome == 'success'
        run: uv run mypy .

      # The FAST tier: everything except the full-bank sweeps, with the
      # randomised fuzzers on a reduced fixed-seed budget.  Their seeds are a
      # prefix of the full set, so a failure here reproduces at the same seed
      # under the release run below.
      - name: Test with pytest (fast tier)
        id: test
        if: always() && steps.install.outcome == 'success'
        env:
          MICROTAINT_TAINT_IR: ${{ matrix.taint_path }}
        # Run sequentially: -p no:xdist forces single-process even if pytest-xdist
        # is ever installed, since the native C extensions can segfault a worker
        # under parallel execution (the flaky test_multi_scenario_backends_agree /
        # RISC-V worker crashes seen only under `-n auto`).
        run: uv run pytest --cov --cov-branch --cov-report=xml -p no:xdist

      - name: Upload coverage reports to Codecov
        if: always() && steps.test.outcome == 'success'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # The SLOW tier: the full-bank ground-truth sweeps and the fuzzers at full
  # budget.  On releases only -- these are release-grade questions ("is the
  # engine sound across 1569 instructions and many vectors") whose answer does
  # not change between two adjacent commits, and running them on every push
  # would spend the day re-answering a settled one.
  #
  # It is REQUIRED on a release, not merely available.  A marker nobody is
  # obliged to run is a marker that quietly deletes its tests, and these are the
  # soundness checks -- the ones that must never be the ones we skipped.
  #
  # Both implementations, because a release has to be correct on both.
  # ---------------------------------------------------------------------------
  release-soundness:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        taint_path: ['0', '1']

    name: release soundness (taint path ${{ matrix.taint_path }})

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Full-bank sweeps and full-budget fuzzing
        env:
          MICROTAINT_TAINT_IR: ${{ matrix.taint_path }}
          MICROTAINT_SLOW_TESTS: '1'
        run: uv run pytest -o addopts="" -p no:xdist -q

  # ---------------------------------------------------------------------------
  # Benchmark job: compares against the baseline stored on master.
  #
  # On pushes to master:   runs benchmarks, saves results as a cache baseline.
  # On pull requests:      runs benchmarks, loads the master baseline, posts a
  #                        comment on the PR with a regression/progression table.
  #
  # The cache key is keyed to the OS + Python version so baselines don't mix
  # across runner environments. The benchmark JSON is stored via actions/cache
  # rather than as a build artifact so it persists across workflow runs.
  # ---------------------------------------------------------------------------
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # needed to post the comparison comment on PRs

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      # Restore the master baseline if it exists
      - name: Restore benchmark baseline
        id: cache-bench
        uses: actions/cache/restore@v4
        with:
          path: .bench_baseline.json
          key: benchmark-baseline-${{ runner.os }}-py313

      - name: Run benchmarks
        run: |
          uv run pytest tests/bench_microtaint.py \
            --benchmark-only \
            --benchmark-json=.bench_current.json \
            --benchmark-disable-gc \
            --benchmark-warmup=on \
            --benchmark-min-rounds=10 \
            -q

      # On PRs: compare against baseline and post a comment
      - name: Compare against baseline and post report
        if: github.event_name == 'pull_request' && steps.cache-bench.outputs.cache-hit == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          uv run python - <<'EOF'
          import json, os, sys

          REGRESSION_THRESHOLD  = 0.10   # 10% slower  → regression  🔴
          PROGRESSION_THRESHOLD = 0.05   # 5%  faster  → progression 🟢

          with open('.bench_baseline.json') as f:
              baseline = {b['name']: b for b in json.load(f)['benchmarks']}
          with open('.bench_current.json') as f:
              current  = {b['name']: b for b in json.load(f)['benchmarks']}

          regressions  = []
          progressions = []
          unchanged    = []
          new_tests    = []

          all_names = sorted(set(current) | set(baseline))

          for name in all_names:
              if name not in baseline:
                  new_tests.append(name)
                  continue

              base_mean = baseline[name]['stats']['mean']
              curr_mean = current[name]['stats']['mean']
              base_std  = baseline[name]['stats']['stddev']
              curr_std  = current[name]['stats']['stddev']
              delta     = (curr_mean - base_mean) / base_mean

              entry = (name, base_mean, curr_mean, base_std, curr_std, delta)
              if delta >  REGRESSION_THRESHOLD:
                  regressions.append(entry)
              elif delta < -PROGRESSION_THRESHOLD:
                  progressions.append(entry)
              else:
                  unchanged.append(entry)

          def fmt_us(s):   return f'{s*1e6:,.1f} µs'
          def fmt_pct(d):  return f'{d:+.1f}%'

          def table(rows):
              lines = ['| Benchmark | Baseline | Current | Δ |',
                       '|-----------|----------|---------|---|']
              for name, bm, cm, bs, cs, d in rows:
                  lines.append(
                      f'| `{name}` | {fmt_us(bm)} ±{fmt_us(bs)} '
                      f'| {fmt_us(cm)} ±{fmt_us(cs)} | {fmt_pct(d*100)} |'
                  )
              return '\n'.join(lines)

          parts = []

          if regressions:
              parts.append('## 🔴 Regressions (> 10% slower)\n\n' + table(regressions))
          if progressions:
              parts.append('## 🟢 Progressions (> 5% faster)\n\n' + table(progressions))
          if new_tests:
              parts.append('## 🆕 New benchmarks\n\n' +
                           '\n'.join(f'- `{n}`' for n in new_tests))
          if not regressions and not progressions and not new_tests:
              parts.append('## ✅ No significant performance changes')

          summary_lines = [f'- Regressions: {len(regressions)}',
                           f'- Progressions: {len(progressions)}',
                           f'- Unchanged: {len(unchanged)}',
                           f'- New: {len(new_tests)}']
          parts.insert(0, '## Benchmark report\n\n' + '\n'.join(summary_lines))

          body = '\n\n'.join(parts)
          print(body)

          # Write to GitHub step summary
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(body + '\n')

          # Post as PR comment
          import urllib.request, urllib.error
          token  = os.environ['GH_TOKEN']
          pr_num = os.environ['PR_NUMBER']
          repo   = os.environ['REPO']
          url    = f'https://api.github.com/repos/{repo}/issues/{pr_num}/comments'
          data   = json.dumps({'body': body}).encode()
          req    = urllib.request.Request(url, data=data, method='POST', headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json',
          })
          try:
              urllib.request.urlopen(req)
          except urllib.error.HTTPError as e:
              print(f'Failed to post comment: {e}', file=sys.stderr)

          # Fail the job if there are regressions
          if regressions:
              print(f'\n{len(regressions)} regression(s) detected — failing.', file=sys.stderr)
              sys.exit(1)
          EOF

      # On PRs without a baseline yet: just print current results
      - name: Print benchmark results (no baseline available)
        if: github.event_name == 'pull_request' && steps.cache-bench.outputs.cache-hit != 'true'
        run: |
          echo "No baseline found for comparison — results below are informational only."
          uv run python - <<'EOF'
          import json
          with open('.bench_current.json') as f:
              data = json.load(f)
          print(f"{'Benchmark':<60} {'Mean (µs)':>12} {'Stddev (µs)':>12}")
          print('-' * 86)
          for b in sorted(data['benchmarks'], key=lambda x: x['name']):
              print(f"{b['name']:<60} {b['stats']['mean']*1e6:>12,.1f} {b['stats']['stddev']*1e6:>12,.1f}")
          EOF

      # On pushes to master: save the current results as the new baseline
      - name: Save new baseline (master only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: cp .bench_current.json .bench_baseline.json

      - name: Store benchmark baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: .bench_baseline.json
          key: benchmark-baseline-${{ runner.os }}-py313
