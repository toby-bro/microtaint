name: Publish PyPI

# Releasing is a deliberate act, never a side effect of pushing a tag. Tags are
# pushed often and most of them are not releases, so nothing here starts on its
# own: run this workflow from the Actions tab and pick the v* tag to publish.
#
# And the tag has to be one master CONTAINS. Work here lives on long-lived
# feature branches, so a v* tag proves only that somebody tagged something --
# publishing from a branch tag would put a version on PyPI that the default
# branch does not have. `check_tag_on_master` gates every job below.
on:
  workflow_dispatch:

jobs:
  # Everything below waits on this.  A tag can be pushed from any branch and
  # most work here happens on long-lived ones, so a v* tag is no evidence that
  # the code in it reached master.  This cannot be an `if:` condition: those are
  # evaluated before any checkout and have no access to git history.
  check_tag_on_master:
    name: Tag must be on master
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && github.repository == 'toby-bro/microtaint'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # reachability cannot be decided from a shallow clone

      - name: Refuse a tag that master does not contain
        run: |
          git merge-base --is-ancestor HEAD origin/master || {
            echo "::error::$GITHUB_REF_NAME is not on master; merge it and move
            the tag onto the merged commit before publishing."
            exit 1
          }

  build_sdist:
    name: Build Source Distribution
    runs-on: ubuntu-latest
    needs: [check_tag_on_master]
    # This workflow publishes to PyPI, so belt and braces: every job refuses to
    # start unless the chosen ref really is a v* tag of this repository. A run
    # dispatched against a branch, or against a fork, reaches nothing. The final
    # publish also waits on the "pypi" environment, which requires a human to
    # approve it.
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && github.repository == 'toby-bro/microtaint'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build sdist
        run: uv build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [check_tag_on_master]
    # A v* tag of this repository only. See build_sdist.
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && github.repository == 'toby-bro/microtaint'
    strategy:
      fail-fast: false
      matrix:
        # This will natively compile your Cython/mypyc code for Linux, Windows, and Mac (including Apple Silicon)
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up MSBuild (Windows only)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3

      - name: Set up MSVC dev cmd (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          # Tell the build environment to trigger hatch-mypyc and set the optimization level
          CIBW_ENVIRONMENT: 'HATCH_BUILD_HOOKS_ENABLE="1" MYPYC_OPT_LEVEL="3"'
          # 3.15 and the free-threaded builds have no pypcode wheel on any platform.
          CIBW_SKIP: "*i686* *musllinux* *win32* cp314t-* cp315-* cp315t-*"
          CIBW_BEFORE_BUILD: >
            git config --global --add safe.directory '*' &&
            python -c "import pathlib, shutil; shutil.rmtree('build', ignore_errors=True); [p.unlink() for ext in ('*.so', '*.pyd', '*.c', '*.o') for p in pathlib.Path('microtaint').rglob(ext)]" &&
            git checkout -- .
          # Smoke-test every wheel, on the platform it was built for, before
          # it can be uploaded.  This pipeline published three wheels, cut a
          # release and pushed to PyPI without ever asking whether any of them
          # produced a taint answer; a wheel whose extensions silently failed
          # to build imports fine and would have shipped.
          #
          # cibuildwheel installs the wheel into a fresh environment and runs
          # this there, so it tests the artifact rather than the checkout.
          # It covers both taint implementations and a real emulated binary on
          # all three platforms: Qiling EMULATES its guest, so the Linux ELF in
          # tests/guests runs from Windows and macOS too.
          #
          # A failure here fails build_wheels, and `publish` needs it, so a
          # wheel that cannot taint cannot be released.
          # setuptools is not a test dependency, it is keystone's.  keystone
          # (a qiling dependency, reached when Qiling loads its x86 support)
          # falls back to `import distutils.sysconfig` when it cannot find its
          # own library the usual way, and distutils was REMOVED in Python
          # 3.12, so on a clean 3.12+ environment that fallback raises
          # ModuleNotFoundError and Qiling reports "Unable to import module
          # .arch.x86".  setuptools ships the distutils shim that makes it
          # work again.  A developer machine hides this: anything that ever
          # installed setuptools has the shim already.
          CIBW_TEST_REQUIRES: pytest setuptools
          # Pillow is why the 3.14 wheels failed to INSTALL on Linux and
          # Windows: qiling declares python-fx (and never imports it), which
          # pins pillow<11, whose newest release ships no wheel past cp313, so
          # pip built it from source and wanted zlib and libjpeg headers.
          # pyproject.toml already answers this for uv with
          # override-dependencies, but that is uv-only and cibuildwheel
          # installs with pip.  The script does the same thing to pip that the
          # override does to uv: keep the node, drop the edges.  36 packages
          # before, 20 after.  before-test runs before the wheel is installed,
          # which is exactly when this has to happen.
          CIBW_BEFORE_TEST: python {project}/scripts/ci/prune_python_fx.py
          # macOS arm64 has no keystone at all, which is the real reason the
          # smoke test failed there.  keystone-engine 0.9.2 was released in
          # 2020, before Apple Silicon, and ships wheels only for
          # macosx_10_14_x86_64, manylinux1 and Windows.  With no dylib to
          # find, its loader falls through to `import distutils.sysconfig`,
          # which is gone in 3.12+, and the resulting ModuleNotFoundError
          # hides the actual cause.
          #
          # Homebrew has keystone 0.9.2 with arm64 bottles, the same version
          # as the binding, so the ABI matches and it installs in seconds
          # instead of compiling the LLVM the sdist would.  /usr/local/lib is
          # on the default dyld fallback search path AND is a location the
          # binding checks explicitly, so dropping it there needs no
          # DYLD_LIBRARY_PATH, which SIP would strip anyway.
          #
          # This step runs BEFORE the wheel is installed, so it cannot import
          # keystone to check itself (keystone arrives as a dependency of the
          # wheel).  Hence the file test: it still fails the build loudly if
          # brew or the copy failed, rather than leaving the smoke test to
          # report something obscure later.
          #
          # Remove once keystone ships an arm64 wheel: keystone-engine#588 is
          # the distutils half, and nothing upstream tracks the arm64 half.
          CIBW_BEFORE_TEST_MACOS: >
            brew install keystone &&
            sudo mkdir -p /usr/local/lib &&
            sudo cp -L "$(brew --prefix)/lib/libkeystone.dylib" /usr/local/lib/ &&
            test -f /usr/local/lib/libkeystone.dylib &&
            python {project}/scripts/ci/prune_python_fx.py
          CIBW_TEST_COMMAND: pytest -o addopts= -p no:cacheprovider {project}/tests/test_wheel_smoke.py
          # Windows only, and it removes noise rather than coverage.
          #
          # Unicorn's Windows memory management raises access violations that
          # it handles itself: uc_mem_map returns UC_ERR_OK, no UcError is
          # raised, the mapping succeeds and the taint is right.  But Python's
          # faulthandler, which pytest enables by default, prints every
          # FIRST-CHANCE access violation through a vectored handler before
          # the owning code gets to handle it.  One CellSimulator is built per
          # test, so a passing run buried its own result under sixty
          # forty-line tracebacks.
          #
          # That is worse than cosmetic: a genuine crash would have been
          # indistinguishable from the noise.  Turning it off costs the
          # traceback on a real fault, but a real fault still kills pytest,
          # still returns non-zero and still fails this job -- and is now
          # visible instead of being the sixty-first traceback.
          CIBW_TEST_COMMAND_WINDOWS: pytest -o addopts= -p no:cacheprovider -p no:faulthandler {project}/tests/test_wheel_smoke.py

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  publish:
    name: Publish to PyPI & GitHub Releases
    needs: [check_tag_on_master, build_sdist, build_wheels]
    runs-on: ubuntu-latest
    # A v* tag of this repository only. See build_sdist.
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && github.repository == 'toby-bro/microtaint'
    environment:
      name: pypi
      url: https://pypi.org/p/microtaint
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Publish to PyPI
        run: uv publish dist/*
